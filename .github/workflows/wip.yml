name: WIP verification
on:
  push:
    branches: [wip]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash .github/wip.sh
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
